# Builds the site and publishes it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Public values: the publishable key is meant to ship to browsers;
          # Row Level Security in Supabase protects the data. Never put the secret key here.
          VITE_SUPABASE_URL: https://yhaudcfqxjpnxclkecdm.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_BFCCcGzfF2Qh10A5ZV5nBg_HW-wAtbo
      # Pages has no app routing, so serve the app for any unknown address (e.g. /Boat-Storage/boats/123).
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
